                - text: ，就是它的 Web UI。默认地址本地回环，不对外暴露，不用担心别人连进来。
              - paragraph [ref=e180]
              - paragraph [ref=e181]:
                - text: 想从源码跑的话，需要 pnpm（
                - code [ref=e182]: npm install -g pnpm
                - text: ）：
              - generic [ref=e183]:
