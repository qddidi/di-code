                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2FAnionex%2Fdsh-vision-toolkit&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e277]: dsh-vision-toolkit
                    - text: ：给纯文本的 DeepSeek 模型加一双眼睛，支持带意图的图片问答、长截图 OCR、UI 还原、像素对比，不是简单桥接一个视觉 API 了事。
                - listitem [ref=e278]:
                  - paragraph [ref=e279]:
                    - link [ref=e280] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fccch1mneyyy%2Fdsh-TUI&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e281]: dsh-TUI
                    - text: ：把整个交互换成 Claude Code 风格的全屏终端，像素鲸鱼顶栏、流式思考展开、双击 Esc 回退、上下文进度条加 TPS 表，npm 一键装。
                - listitem [ref=e282]:
                  - paragraph [ref=e283]:
                    - link [ref=e284] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fzhu1090093659%2Fdsh-web-ui&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e285]: dsh-web-ui
                    - text: ：Web UI 增强全家桶，任务看板、Git 图谱、右侧面板、手机端远程界面、实时 token 统计、皮肤中心，一个插件包补齐官方界面缺的几块。
                - listitem [ref=e286]:
                  - paragraph [ref=e287]:
                    - link [ref=e288] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fomdsh-dev%2FDSH-better-sidebar&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e289]: DSH-better-sidebar
                    - text: ：把侧边栏改成完整工作台，内置文件渲染编辑器、终端、Git 面板和子代理管理，还支持第三方注册新 Tab 页。
                - listitem [ref=e290]:
                  - paragraph [ref=e291]:
                    - link [ref=e292] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Flhh010%2Fdsh-ui-whale&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e293]: dsh-ui-whale
                    - text: ：在会话标题栏养一只手绘像素鲸鱼，空闲时眨眼游来游去，思考时会动，回合结束喷个水。
                - listitem [ref=e294]:
                  - paragraph [ref=e295]:
                    - link [ref=e296] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fvlln%2Fwhale-girl&objectId=2726629&objectType=1&contentType=markdown
                      - strong [ref=e297]: whale-girl
                    - text: ：QQ 宠物形态的鲸鱼娘桌宠，浮在界面上能拖拽、能投喂、能互动。
              - paragraph [ref=e298]:
                - text: 最绝的是
                - link "Nagi-ovo/dsh-ads" [ref=e299] [cursor=pointer]:
                  - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2FNagi-ovo%2Fdsh-ads&objectId=2726629&objectType=1&contentType=markdown
                - text: 这个插件，给 Web 界面加上 2005 年中文网站风格的侧栏广告、对话内信息流和角落弹窗，连关闭按钮的点击区域都故意做得比看着小——纯粹的抽象艺术。按 36氪 当晚的实测报道，目录里还紧挨着一个专门屏蔽它的插件，广告是插件、去广告也是插件，生态自己先完成了一轮攻防（这个我没亲测，大家可以自己去翻）。
              - paragraph [ref=e300]:
                - text: 当然也不全是玩具。远程渠道有
                - code [ref=e301]: qqbot
                - text: 、
                - code [ref=e302]: dsh-weixin-bot
                - text: 、
                - code [ref=e303]: dsh-feishu-bot
                - text: 、
                - code [ref=e304]: dsh-wecom-bot
                - text: 、
                - code [ref=e305]: telegram
                - text: 这一批（都在 dsh-external 组织下），装上之后 DSH 就能变成一个在 QQ 群、飞书里被 @ 的机器人；沙箱也有多种社区隔离方案可选，从轻量容器到内核级强制访问控制都有人在做。
              - paragraph [ref=e306]: 装插件这事儿本身也很 DSH——不用自己翻文档拼命令，把仓库地址丢给对话框里的 Agent，用大白话说「帮我装这个」，它自己读完 README 就把活干了，遇到要改配置或重启的时候会停下来等你批权限。嫌审批烦可以把操作权限暂时放开，跑完再收回来；想稳一点就让它每步都问你。不想要了也是一句话卸载。
              - heading "六、小 Demo：给自己写了只喷水鲸鱼，顺便看了眼缓存命中率" [level=2] [ref=e307]: § 六、小 Demo：给自己写了只喷水鲸鱼，顺便看了眼缓存命中率
              - paragraph [ref=e308]: 光说不练假把式，我照着 DSH 的插件 API 撸了个小玩具：一只趴在网页右下角的 DeepSeek 鲸鱼桌宠，专门用来盯着 Agent 的思考进度。
              - paragraph [ref=e309]: 逻辑很简单：你一发消息，鲸鱼就开始喷水，水柱下面挂一条进度条，根据当前回合已经吐出的 token 数实时往前跑；等 DSH 返回最终结果、这一轮结束，鲸鱼立刻闭嘴收水，回到空闲状态摆尾巴。整个插件就挂在 Web UI 的 DOM 上，不改 DSH 源码，纯靠 Cordis 的事件总线监听回合开始和结束——这也是「一切皆插件」最直观的好处：想加个什么东西，不用等官方，自己挂一个就行。
              - paragraph [ref=e310]: 效果是这样的，思考中喷水 + 进度条走动：
              - paragraph [ref=e311]
              - paragraph [ref=e312]: 跑完之后 DSH 自己的 Trajectory 状态栏把账算得明明白白，不用我去后台翻：
              - blockquote [ref=e313]:
                - paragraph [ref=e314]:
                  - strong [ref=e315]: 6 轮 · 115 步 | LLM 16m20s · 工具调用 2m33s | 首 token 平均 1.6s · 145 tok/s | 缓存命中 99% | 输入 15.4M tok · 输出 1.16M tok
              - paragraph [ref=e316]:
                - text: 说几个值得品的数字。这 6 轮里其实有 2 轮是我自己试错发的废消息，真正干活的就 4 轮，结果 DSH 跑了
                - strong [ref=e317]: 115 步
                - text: 、LLM 累计思考了 16 分 20 秒——Agent 场景下 token 消耗和你聊多少句话基本没关系，全看它在背后调了多少轮工具、读了多少文件。
              - paragraph [ref=e318]:
                - text: 最扎眼的是
                - strong [ref=e319]: 缓存命中 99%
                - text: 。1540 万输入 token 里只有不到 1% 是真正新发给模型的，剩下 99% 全是前缀缓存兜住的。DeepSeek 的缓存命中输入价比未命中价低一到两个数量级——涨价前 V4 Pro 是 0.025 元 vs 3 元（百分之一这个量级），8 月 17 日涨价后高峰时段也才 0.3 元 vs 9 元（三十分之一）。99% 命中意味着实际输入成本只有全 miss 的零头，Agent 这种长会话，缓存就是省钱的命根子。
              - paragraph [ref=e320]:
                - text: 99% 这个数字不是我调出来的，是 DSH 的架构天然喂出来的。每一回合请求，系统提示词、工具定义、已注入的 Skill、会话历史这些内容全部排在消息序列最前面，并且只要你不在中途切模型、切模式，它们字节级不变——这就是
                - strong [ref=e321]: 前缀缓存
                - text: 最理想的命中对象。DSH 的 Trajectory（轨迹）机制把模型看到的一切按顺序写进只增不改的事件日志，前缀天然不会乱序，也就不会出现「内容一样但顺序变了导致缓存失效」这种糟心事。
              - blockquote [ref=e322]
              - paragraph [ref=e323]:
                - strong [ref=e324]: 可能有人会问：那我自己写插件、改 UI，会不会把前缀搞乱导致命中率掉下来？
              - paragraph [ref=e325]: 不会。你挂在前端的插件（比如我这只鲸鱼）走的是浏览器侧的 DOM 和 Cordis 事件，根本不进请求体；只有那些往系统提示词或工具列表里塞内容的插件才会影响前缀。装这类插件时装一次就别动了，别在会话中途反复启停，命中率就稳。
              - paragraph [ref=e326]: 说回这只鲸鱼。写完最大的感受是：DSH 把「改界面」和「改 Agent 行为」放到了同一个难度层级上。以前用 Claude Code 想在界面上加个活物，门都没有；在这里就是注册一个 Cordis 插件、监听两个事件、画一段 CSS 动画的事。你甚至可以让鲸鱼的颜色跟着当前选中的模型变，或者在子 Agent 被派出去时让它背着小书包出门——反正都是插件，想怎么折腾怎么折腾。
              - heading "七、几个必须说清楚的坑" [level=2] [ref=e327]: § 七、几个必须说清楚的坑
              - paragraph [ref=e328]:
                - text: 体验归体验，这东西现在是
                - strong [ref=e329]: v0.1 开发者预览版
                - text: ，官方 README 用全大写字母写了一句话：
                - strong [ref=e330]: THERE WILL BE COMPATIBILITY-BREAKING CHANGES
                - text: 。一定会有破坏兼容性的变更。别现在就把它接到生产关键路径上。
              - paragraph [ref=e331]: 具体说几个我踩到的点：
              - list [ref=e332]:
                - listitem [ref=e333]:
                  - paragraph [ref=e334]:
                    - strong [ref=e335]: Node 版本要够新。
                    - text: 官方要求 Node.js v22.19 以上或 v24+，低版本 npx 会报一堆看不懂的错，先
                    - code [ref=e336]: node --version
                    - text: 确认，别拿 v18/v20 硬怼。
                - listitem [ref=e337]:
                  - paragraph [ref=e338]:
                    - strong [ref=e339]: Bash noop 空转是已知 bug。
                    - text: 某些情况下 Agent 会反复执行空的 Bash 命令不推进任务，遇到就手动中断重新发起，别干等。
                - listitem [ref=e340]:
                  - paragraph [ref=e341]:
                    - strong [ref=e342]: 安全攻击面比一般工具大。
                    - text: 插件能碰你的 shell 和文件系统，第三方插件装之前看一眼源码。已经有第三方团队做了防御性安全审计，发布了 13 个可复现的攻击链 demo 和实时验证产物，这不是开玩笑的。
                - listitem [ref=e343]:
                  - paragraph [ref=e344]:
                    - strong [ref=e345]: Windows 上优先用 Web UI。
                    - text: Python SDK 在 Windows 原生环境下的兼容性我没全部验证过，Windows 用户想省事就直接走
                    - code [ref=e346]: npx @deepseek-ai/dsh web
                    - text: ，需要脚本化再考虑 WSL。
              - paragraph [ref=e347]
              - paragraph [ref=e348]: 最后说个我的判断。
              - paragraph [ref=e349]: DeepSeek 选在 API 调价的同一个晚上开源 Harness，不是巧合。Anthropic 需要 harness 这层值钱，因为它卖的是模型加外壳的整体；DeepSeek 需要 harness 不值钱，因为这层一旦被拉平成公共品，竞争就被压回模型本身的能力和价格上——而那已经是 DeepSeek 的主场了。R1 当年把闭源模型的溢价打下来，这一次 DSH 想把闭源外壳的溢价也打下来。
              - paragraph [ref=e350]:
                - text: 而且从我这一晚上的实测看，
                - strong [ref=e351]: 自己的模型配自己的 Harness，确实比硬套别人家的壳顺手
                - text: ——V4 Pro 虽然官方也提供了 Codex、Claude Code 的接入文档，但那套是适配别人的协议和交互；在 DSH 里，模型、工具、缓存、Trajectory 日志是一套一起设计的，99% 的缓存命中率也不是随便哪个第三方外壳都能喂出来的。模型和外壳本来就该一起演化，这点鱼皮那篇实测也得出了一样的结论。
              - paragraph [ref=e352]: 8 月 17 日涨价之后账还得重新算，但至少现在，你可以零成本把 DeepSeek Harness 跑在自己机器上、随便改成自己想要的样子——模型、工具、UI，没有一样是焊死的。
              - separator [ref=e353]
              - paragraph [ref=e354]: 我是程序员天天困，持续分享编程干货。觉得有用的话记得点赞收藏和关注~也欢迎在评论区聊聊：你装上 DeepSeek Harness 之后第一个想装的插件是哪个？
