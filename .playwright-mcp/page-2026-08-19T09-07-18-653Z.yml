              - paragraph [ref=e205]:
                - text: 仓库地址就是
                - link "deepseek-ai/deepseek-harness" [ref=e206] [cursor=pointer]:
                  - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fdeepseek-ai%2Fdeepseek-harness&objectId=2726629&objectType=1&contentType=markdown
                - text: ，我写这段的时候 Star 已经 8.7 万，上线不到一天冲到这个数，这个涨速在 GitHub 历史上都排得上号。
              - paragraph [ref=e207]
              - heading "三、第一次打开，三步开聊" [level=2] [ref=e208]: § 三、第一次打开，三步开聊
              - paragraph [ref=e209]: Web UI 加载完之后别着急敲消息，输入框默认是灰的，有两件事必须先做。
              - paragraph [ref=e210]:
                - strong [ref=e211]: 第一步：配 API Key。
                - text: 进 Settings → Models，找到 DeepSeek 那张卡片，把你的
                - code [ref=e212]: sk-...
                - text: 填进去保存。Key 存在本地配置目录里，界面只显示脱敏后的描述符，不会回显明文。第一次打开会直接弹出填 Key 的页面，去 DeepSeek 开放平台创建一个就行；也可以在这里接入其他 OpenAI 兼容的模型。
              - paragraph [ref=e213]
              - paragraph [ref=e214]:
                - strong [ref=e215]: 第二步：选工作区。
                - text: 点「选择工作区」，添加一个你想让 Agent 操作的项目目录。你在哪个目录启动的
                - code [ref=e216]: dsh web
                - text: ，那个目录就是默认工作区，但你得手动点一下选中它，输入框才会解锁。
              - paragraph [ref=e217]
              - paragraph [ref=e218]:
                - strong [ref=e219]: 第三步：派活。
                - text: 比如丢一句「总结这个仓库，告诉我主要的包结构」，它就开始读文件、跑命令、维护执行计划。涉及写操作的时候，UI 会按权限策略弹审批，不会偷偷改你东西。
              - paragraph [ref=e220]: 干活过程中每一步在做什么——读了哪个文件、调了什么工具、工具返回了什么——全都摊开在时间线上。顶部还有个「轨迹（Trajectory）」面板，把模型看到的系统提示、推理过程、工具调用、子 Agent 调度按顺序记成一份只增不改的日志，支持导出，出了问题可以逐条复盘它当时到底看到了什么、为什么这么做。这比那种全程黑盒、最后只甩给你一个结果的工具让人踏实多了。
              - paragraph [ref=e221]
              - heading "四、四种模式，别上来就用标准模式" [level=2] [ref=e222]: § 四、四种模式，别上来就用标准模式
              - paragraph [ref=e223]: DSH 内置四种模式，本质是四份不同的插件配置清单。这个设计本身就很有意思——官方模式和社区做的整合包在地位上没有任何差别，都是插件组合。
              - table [ref=e226]:
                - rowgroup [ref=e227]:
                  - row [ref=e228]:
                    - columnheader "模式" [ref=e229]
                    - columnheader "干什么用" [ref=e230]
                    - columnheader "开箱工具" [ref=e231]
                - rowgroup [ref=e232]:
                  - row [ref=e233]:
                    - cell "标准模式" [ref=e234]
                    - cell "完整编程 Agent" [ref=e235]
                    - cell "文件编辑、shell、搜索、技能、规划、子 Agent、工作流" [ref=e236]
                  - row [ref=e237]:
                    - cell "PTC 模式" [ref=e238]
                    - cell "模型写一段代码编排多次工具调用" [ref=e239]
                    - cell "Code Mode SDK，把十次来回合并成一次执行" [ref=e240]
                  - row [ref=e241]:
                    - cell "极简模式" [ref=e242]
                    - cell "跑基准、看模型裸实力" [ref=e243]
                    - cell "一个持久 bash + 一个文件编辑器，仅此而已" [ref=e244]
                  - row [ref=e245]:
                    - cell "创造模式" [ref=e246]
                    - cell "在内存里试插件、造新模式" [ref=e247]
                    - cell "可检查运行时、热加载 Cordis 插件" [ref=e248]
              - paragraph [ref=e249]
              - paragraph [ref=e250]:
                - strong [ref=e251]: PTC（Programmatic Tool Calling，程序化工具调用）
                - text: ：普通模式下模型每调一次工具就得跟客户端来回一次，十次工具十轮往返；PTC 换了个思路，让模型直接产出一段 TS 脚本，把这些操作串起来一次跑完。相当于模型从「逐条下指令的实习生」变成「自己写脚本批量跑的工程师」。
              - paragraph [ref=e252]: 好处是快、省 token，坏处是这段代码跑起来你得想清楚它在干什么——所以沙箱和权限策略要配好。
              - paragraph [ref=e253]: 我的建议是：第一次用先开极简模式，让它在一个小目录里干一件简单的活，感受一下它的节奏；熟悉了再切标准模式。PTC 和创造模式等你想折腾插件的时候再碰。
              - heading "五、「一切皆插件」才是这玩意真正的杀招" [level=2] [ref=e254]: § 五、「一切皆插件」才是这玩意真正的杀招
              - paragraph [ref=e255]:
                - strong [ref=e256]: Cordis
                - text: ：从 Koishi（国内老牌 QQ 机器人框架）里抽出来的微内核，作者是 GitHub 上的 Shigma。它只管三件事——加载插件、卸载插件、管理插件之间的依赖，本身不提供任何 Agent 能力。打个比方，Cordis 是主板插槽，具体能力全靠插上去的插件卡。
              - paragraph [ref=e257]: 官方文档把这点列得很直白：从模型到工具、从会话存储到沙箱策略、从调度循环到你看到的那个 Web 界面，每一样都是可插拔的插件，没有谁是焊死在框架里的。
              - paragraph [ref=e258]:
                - text: 这句话听着像口号，但它有个很硬的技术底座叫「可逆副作用」：每个插件注册时产生的所有副作用都会被追踪，卸载时自动回收，不留垃圾、不漏内存。翻译成使用体验就是
                - strong [ref=e259]: 热插拔
                - text: ——装插件、卸插件、换整套 UI，都不用重启，系统跑着跑着就把自己的一部分换掉了。
              - paragraph [ref=e260]:
                - text: 这个设计带来的结果是：
                - strong [ref=e261]: 连 DeepSeek 自己的模型都没有特殊地位，它也就是又一个插件而已。
                - text: 你想换成 Kimi、GLM、任何 OpenAI 兼容端点的模型，跟换个主题皮肤是同一个操作。在 Claude Code 里，用哪个模型、有什么能力，全是 Anthropic 定的，用户碰都碰不到；在 DSH 里，这两件事和换桌宠是同一个层级的事。
              - paragraph [ref=e262]
              - paragraph [ref=e263]:
                - text: 社区反应快得离谱。36氪 8 月 13 日当晚实测时一个目录收录了 288 个插件仓库；到我写这篇的时候，GitHub 上打
                - code [ref=e264]: dsh-plugin
                - text: 标签的仓库已经超过 1000 个，还在涨。想自己逛的话，这两个目录比较全：
              - list [ref=e265]:
                - listitem [ref=e266]:
                  - paragraph [ref=e267]:
                    - link "awesome-deepseek-harness" [ref=e268] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2F0xsline%2Fawesome-deepseek-harness&objectId=2726629&objectType=1&contentType=markdown
                    - text: （0xsline 维护，带安装命令）
                - listitem [ref=e269]:
                  - paragraph [ref=e270]:
                    - link "Awesome DSH Plugin" [ref=e271] [cursor=pointer]:
                      - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fgithub.com%2Fawesome-dsh-plugin%2Fawesome-dsh-plugin&objectId=2726629&objectType=1&contentType=markdown
                    - text: （中英双语，分类更细）
              - paragraph [ref=e272]: 我挑几个印象深的，仓库地址都给你，可以直接点进去装：
              - list [ref=e273]:
                - listitem [ref=e274]:
