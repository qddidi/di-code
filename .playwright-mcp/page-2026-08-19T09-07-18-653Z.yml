            - generic [ref=e91]: 概述
            - generic [ref=e93]: DeepSeek Harness 开源首夜我装好了。本文给四种下载方式、四模式区别、插件生态实测，以及一段 99% 缓存命中率的真实账单
        - generic [ref=e94]:
          - generic [ref=e98]:
            - text:             
            - generic [ref=e99]:
              - paragraph [ref=e100]: 大家好，我是程序员天天困。
              - paragraph [ref=e101]:
                - text: 昨晚刚把
                - link "DeepSeek V4 Pro 正式版的文章" [ref=e102] [cursor=pointer]:
                  - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fmp.weixin.qq.com%2Fs%2FSwiMtEXU9FmM5zOzVaC8mQ&objectId=2726629&objectType=1&contentType=markdown
                - text: 发出去，本来想着吃完饭能歇口气，结果往沙发上一躺刷手机，朋友圈直接被 DeepSeek Harness 的公众号推送刷屏了。我当时就一个念头：来了，终于来了。
              - paragraph [ref=e103]:
                - text: 说真的这个节奏有点狠。白天 DeepSeek 先甩出 API 调价方案（8 月 17 日起实行峰谷定价，V4 Pro 高峰输出价从 6 元涨到 27 元/百万 token），晚上 V4 Pro 正式版（
                - code [ref=e104]: DeepSeek-V4-Pro-0813
                - text: ）上线，没过几个小时，Harness v0.1 开发者预览版直接 MIT 协议甩到 GitHub 上。一晚上三件事叠在一起，想不上热搜都难。
              - paragraph [ref=e105]
              - paragraph [ref=e106]: 今天这篇不讲虚的，从它是什么、怎么装、四种模式怎么选，到插件生态和我自己跑的小 demo，一条龙给你讲清楚。点个收藏，咱们开始。
              - heading "一、Harness 到底是个什么东西" [level=2] [ref=e107]: § 一、Harness 到底是个什么东西
              - paragraph [ref=e108]: 先把名字说清楚。
              - paragraph [ref=e109]:
                - strong [ref=e110]:
                  - text: DeepSeek Harness（简称 DSH，命令行名
                  - code [ref=e111]: dsh
                  - text: ）
                - text: ：DeepSeek 在 2026 年 8 月 13 日开源的 AI Agent 运行框架，MIT 协议。它干的活是模型本身不干的那部分——替模型记住上下文、替它调用工具、替它在文件和终端之间跑腿，直到把一整件事办完。你可以理解为「模型是灵魂，Harness 是让灵魂能在你电脑上动手的那具身体」。
              - paragraph [ref=e112]:
                - text: DeepSeek 自己在招聘时写过一个公式：
                - strong [ref=e113]: Model + Harness = Agent
                - text: 。光有模型它只会跟你聊天，加上 Harness 它才能读你的代码、跑你的命令、改你的文件。这个公式我在一个多月前那篇
                - link "《Harness Engineering 是什么？》" [ref=e114] [cursor=pointer]:
                  - /url: https://developer.cloud.tencent.com/tools/blog-entry?target=https%3A%2F%2Fmp.weixin.qq.com%2Fs%2F2t3n_Lowotmx5uWogBTEWQ&objectId=2726629&objectType=1&contentType=markdown
                - text: 里详细聊过——当时还在讲方法论，现在 DeepSeek 直接把参考实现开源了。
              - paragraph [ref=e115]: 这个定位说白了就是对标 Anthropic 的 Claude Code 和 OpenAI 的 Codex。但 DSH 从第一天就没打算做一个「更好用的 Claude Code」，它走的是另一条路——把这一层整个开源掉。这个区别很关键，后面讲插件的时候你就明白了。
              - heading "二、四种下载方式，挑一个就行" [level=2] [ref=e116]: § 二、四种下载方式，挑一个就行
              - paragraph [ref=e117]: DSH 的安装门槛在主流 Agent 框架里算低的，我给四条路，按你的需求选。
              - table [ref=e120]:
                - rowgroup [ref=e121]:
                  - row [ref=e122]:
                    - columnheader "方式" [ref=e123]
                    - columnheader "命令" [ref=e124]
                    - columnheader "适合谁" [ref=e125]
