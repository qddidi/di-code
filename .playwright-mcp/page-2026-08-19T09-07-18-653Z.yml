                      - code [ref=e130]: npx @deepseek-ai/dsh web
                    - cell "想先体验、不想装全局包" [ref=e131]
                  - row [ref=e132]:
                    - cell "全局安装" [ref=e133]
                    - cell [ref=e134]:
                      - code [ref=e135]: npm install -g @deepseek-ai/dsh && dsh web
                    - cell "日常用、想固定版本" [ref=e136]
                  - row [ref=e137]:
                    - cell "源码构建" [ref=e138]
                    - cell [ref=e139]:
