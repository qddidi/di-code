                    - cell [ref=e147]:
                      - text: 嵌进 CI/CD 或脚本（官方仓库
                      - code [ref=e148]: python/
                      - text: 目录）
              - paragraph [ref=e149]:
                - text: 最快的是第一种。确认你机器上有 Node.js
                - strong [ref=e150]: v22.19 以上
                - text: （官方 package.json 里 engines 写的是
                - code [ref=e151]: ^22.19.0 || >=24.0.0
                - text: ，用
                - code [ref=e152]: node --version
                - text: 看一眼，版本低了先去升），然后终端里敲：
